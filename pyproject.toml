[project]
name = "template-backend"
version = "0.1.0"
description = "Python template backend"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "asyncpg>=0.31.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=7.3.0",
    "sqlalchemy[asyncio]>=2.0.48",
]

[dependency-groups]
develop = [
    "mypy>=1.19.1",
    "ruff>=0.15.6",
]
http = [
    "fastapi>=0.135.1",
    "gunicorn>=25.1.0",
    "uvicorn>=0.42.0",
]
sheduler = [
    "apscheduler>=3.11.2",
]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
